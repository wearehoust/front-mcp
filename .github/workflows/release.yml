name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to register in MCP Registry (npm must already be published)"
        required: true
        type: string

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release version
        run: |
          node <<'NODE'
          const expected = process.env.GITHUB_REF_NAME.slice(1);
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const server = require('./server.json');
          const source = require('node:fs').readFileSync('./src/server.ts', 'utf8');
          const handshake = source.match(/name:\s*"front-mcp-server",\s*version:\s*"([^"]+)"/)?.[1];
          if (!handshake) {
            throw new Error('Could not read MCP handshake version');
          }
          const versions = [pkg.version, lock.version, lock.packages[''].version, server.version, ...server.packages.map(p => p.version), handshake];
          if (versions.some(version => version !== expected)) {
            throw new Error('Release tag and package/registry/handshake versions must match');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run smoke
        env:
          FRONT_MCP_AUTH_METHOD: api_token

      - name: Publish to npm
        run: npm publish --provenance --access public

  publish-registry:
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected an existing vX.Y.Z release tag."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify registry release version
        run: |
          node <<'NODE'
          const expected = process.env.RELEASE_TAG.slice(1);
          const pkg = require('./package.json');
          const server = require('./server.json');
          if (pkg.version !== expected || server.version !== expected ||
              server.name !== pkg.mcpName || server.packages.length !== 1 ||
              server.packages[0].registryType !== 'npm' ||
              server.packages[0].identifier !== pkg.name ||
              server.packages[0].version !== expected) {
            throw new Error('Release tag and npm/registry metadata must match');
          }
          NODE

      - name: Install mcp-publisher
        run: |
          curl --fail --show-error --location "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: |
          for attempt in 1 2 3 4 5 6; do
            if output=$(./mcp-publisher publish 2>&1); then
              printf '%s\n' "$output"
              exit 0
            fi
            printf '%s\n' "$output"
            if [[ "$output" != *"NPM package "* ||
                  "$output" != *"was not found (status: 404)"* ||
                  "$attempt" -eq 6 ]]; then
              exit 1
            fi
            echo "Waiting 30 seconds for npm version propagation (attempt $attempt/6)."
            sleep 30
          done
