name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release version
        run: |
          node <<'NODE'
          const expected = process.env.GITHUB_REF_NAME.slice(1);
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const server = require('./server.json');
          const source = require('node:fs').readFileSync('./src/server.ts', 'utf8');
          const handshake = source.match(/name:\s*"front-mcp-server",\s*version:\s*"([^"]+)"/)?.[1];
          if (!handshake) {
            throw new Error('Could not read MCP handshake version');
          }
          const versions = [pkg.version, lock.version, lock.packages[''].version, server.version, ...server.packages.map(p => p.version), handshake];
          if (versions.some(version => version !== expected)) {
            throw new Error('Release tag and package/registry/handshake versions must match');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run smoke
        env:
          FRONT_MCP_AUTH_METHOD: api_token

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Install mcp-publisher
        run: |
          curl --fail --show-error --location "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
